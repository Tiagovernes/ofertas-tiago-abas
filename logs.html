<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Logs Espelhamento</title><script src="https://telegram.org/js/telegram-web-app.js"></script><link rel="stylesheet" href="estilo.css"></head><body><div id="app"></div><script src="comum.js"></script><script>
let L,F='todos';const COR={enviada:'#16a34a',repetida:'#dc2626',barrada:'#ea580c'};
function tela(){const l=L.filter(x=>F==='todos'||x.s===F);$('#app').innerHTML='<div class=topo><h1>Logs Espelhamento</h1></div><div class=lista><div class=chk style="margin-bottom:10px;gap:6px">'+[['todos','Todos'],['enviada','Publicadas'],['repetida','Repetidas'],['barrada','Não foram']].map(([k,t])=>'<span class="badge '+(F===k?'azul':'cinzab')+'" style="font-size:13px;padding:5px 10px" onclick="F=\''+k+'\';tela()">'+t+'</span>').join('')+'</div>'+
(l.length?l.map(x=>'<div class=card><div style="font-weight:600">Grupo: '+esc(x.g)+'</div><div style="color:'+COR[x.s]+';font-weight:600;font-size:13px;margin:4px 0">Status: '+esc(x.s==='enviada'?'Foi para Publicação':x.s==='repetida'?x.m:'Não foi — '+x.m)+'</div><div class=info><span>Modo: '+(x.o==='copy'?'Copy':'Post')+'</span><span>Data: '+new Date(x.t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+'</span></div><pre style="white-space:pre-wrap;font-family:inherit;font-size:13px;margin:6px 0 0;color:#374151">'+esc(x.x)+'</pre></div>').join(''):'<div class=vazio>Nenhum registro.</div>')+'</div>'}
lerDados().then(d=>{if(!d)return semDados();L=d.l;tela()}).catch(semDados);
</script></body></html>
